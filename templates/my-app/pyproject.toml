[project]
name = "my-app"
version = "0.1.0"
description = "Minimal pi-coding-agent SDK application template"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pi-coding-agent"]

[project.scripts]
my-app = "my_app.main:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_app"]

# Standalone app: piPy SDK from Git (subdirectory installs).
# Pin with rev = tag or commit SHA; switch url if you fork piPy.
[tool.uv.sources]
pi-coding-agent = { git = "https://gitee.com/www6v6v/piPy.git", subdirectory = "packages/pi_coding_agent", rev = "master" }
pi-agent = { git = "https://gitee.com/www6v6v/piPy.git", subdirectory = "packages/pi_agent", rev = "master" }
pi-ai = { git = "https://gitee.com/www6v6v/piPy.git", subdirectory = "packages/pi_ai", rev = "master" }
