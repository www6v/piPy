[project]
name = "pi-agent"
version = "0.0.1"
description = "Agent runtime with tool calling for piPy"
requires-python = ">=3.11"
dependencies = [
    "pi-ai",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_agent"]

[tool.uv.sources]
pi-ai = { workspace = true }
