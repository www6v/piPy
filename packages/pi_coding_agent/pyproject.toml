[project]
name = "pi-coding-agent"
version = "0.0.1"
description = "Coding agent CLI for piPy"
requires-python = ">=3.11"
dependencies = ["pi-agent", "pi-ai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_coding_agent"]

[tool.uv.sources]
pi-agent = { workspace = true }
pi-ai = { workspace = true }

[project.scripts]
pipy = "pi_coding_agent.cli:main"
