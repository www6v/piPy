[project]
name = "pipy-monorepo"
version = "0.0.1"
description = "Python port of the pi agent harness"
requires-python = ">=3.11"
dependencies = [
    "pi-ai",
    "pi-agent",
    "pi-coding-agent",
]

[tool.uv.sources]
pi-ai = { workspace = true }
pi-agent = { workspace = true }
pi-coding-agent = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "example/tests"]
pythonpath = [
    "packages/pi_ai/src",
    "packages/pi_agent/src",
    "packages/pi_coding_agent/src",
    "example",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
